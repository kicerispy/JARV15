name: JARVIS Verification

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"

jobs:
  python-compile-and-focused-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ollama playwright psutil certifi requests pyautogui

      - name: Compile active JARVIS modules
        run: |
          python -m py_compile             browser_agent.py             browser_agent_worker.py             browser_controller.py             roblox_mcp.py             commands.py             config.py             main.py             planner.py             runtime_health.py             smart_router.py             state.py             task_controller.py             tool_executor.py             tool_registry.py             intent_resolver.py             postcondition_verifier.py             answer_composer.py             tools.py             run_jarvis.py

      - name: Run focused regression tests
        run: |
          python -m pytest             tests/test_activation_controller.py             tests/test_adaptive_speech_gate.py             tests/test_agent_planning.py             tests/test_n8n_bridge.py             tests/test_planner_model_manager.py             tests/test_roblox_mcp.py             tests/test_roblox_planner_routes.py             tests/test_roblox_routing_regressions.py             tests/test_roblox_routing_followup.py             tests/test_browser_agent.py             tests/test_browser_qol_push.py             tests/test_commands.py             tests/test_qol_runtime.py             tests/test_smart_router.py             tests/test_task_controller.py             tests/test_autonomy_core_v1.py             tests/test_natural_action_routing.py             tests/test_self_improvement_routing.py             tests/test_autonomy_kernel_v2.py             -q
